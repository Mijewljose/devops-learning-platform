version: "3.9"

services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: dev-backend
    ports:
      - "5000:5000"
    restart: always
    networks:
      - dev-plt-net

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: dev-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: always
    networks:
      - dev-plt-net

networks:
  dev-plt-net:
    driver: bridge
